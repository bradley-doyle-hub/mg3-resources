<style>
  :root{
    --bg:#F4F1EA; --surface:#FAF8F3; --text:#0E0E0E; --muted:#6B6962;
    --border:rgba(14,14,14,0.12); --accent:#1D5C6B; color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1A1A1A; --surface:#2A2926; --text:#F4F1EA; --muted:#A9A392;
      --border:rgba(244,241,234,0.14); --accent:#5FB3C4; color-scheme:dark;
    }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ background:var(--bg); color:var(--text); font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif; line-height:1.55; padding-inline:20px; }
  main{ max-width:1200px; margin:0 auto; padding-block:56px 80px; }
  .eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent); margin-bottom:14px; }
  .eyebrow::before{ content:""; width:7px; height:7px; border-radius:2px; background:var(--accent); display:inline-block; }
  h1{ font-size:clamp(28px,5vw,38px); font-weight:700; letter-spacing:-0.02em; margin:0 0 14px; }
  .lede{ font-size:17px; color:var(--muted); max-width:56ch; margin:0 0 32px; }
  .grid{ display:grid; grid-template-columns:repeat(3,1fr); align-items:start; gap:18px; }
  @media (max-width:640px){ .grid{ grid-template-columns:1fr; } }
  .card{ background:#fff; border:1px solid var(--border); border-radius:4px; overflow:hidden; cursor:pointer; }
  .card svg{ display:block; width:100%; height:100%; }
  footer{ margin-top:64px; padding-top:20px; border-top:1px solid var(--border); color:var(--muted); font-size:13.5px; }
  footer a{ color:var(--muted); }
  footer a:hover{ color:var(--accent); }
</style>
